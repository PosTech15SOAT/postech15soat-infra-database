name: Terraform Apply

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      confirm_apply:
        description: 'Type APPLY after reviewing a plan'
        required: true
        type: string

permissions:
  contents: read

jobs:
  apply:
    if: >-
      github.ref == 'refs/heads/main' &&
      (
        github.event_name == 'push' ||
        (
          github.event_name == 'workflow_dispatch' &&
          inputs.confirm_apply == 'APPLY'
        )
      )

    runs-on: ubuntu-latest

    concurrency:
      group: terraform-database-apply
      cancel-in-progress: false

    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_DEFAULT_REGION: ${{ vars.AWS_REGION }}
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_VAR_cloud_state_bucket: ${{ vars.TF_STATE_BUCKET }}
      TF_IN_AUTOMATION: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5

      - name: Check required configuration
        shell: bash
        run: |
          set -euo pipefail

          for name in AWS_REGION AWS_ACCOUNT_ID \
            AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY \
            AWS_SESSION_TOKEN TF_STATE_BUCKET; do

            if [[ -z "${!name:-}" ]]; then
              echo "::error::$name is not configured."
              exit 1
            fi
          done

      - name: Verify AWS Academy session
        shell: bash
        run: |
          set -euo pipefail

          ACTUAL_ACCOUNT_ID="$(aws sts get-caller-identity \
            --query Account --output text)"

          if [[ "$ACTUAL_ACCOUNT_ID" != "$AWS_ACCOUNT_ID" ]]; then
            echo "::error::AWS account does not match AWS_ACCOUNT_ID."
            exit 1
          fi

          echo "AWS account verified: $ACTUAL_ACCOUNT_ID"

      - name: Terraform Init
        run: |
          terraform init -input=false \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="region=$AWS_REGION"

      - name: Terraform Format
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Apply
        run: |
          terraform apply \
            -input=false \
            -auto-approve \
            -var-file=terraform.tfvars.example
