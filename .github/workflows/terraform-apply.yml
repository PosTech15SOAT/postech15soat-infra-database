name: Terraform Apply

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apply:
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    env:
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_VAR_cloud_state_bucket: ${{ vars.TF_STATE_BUCKET }}
      TF_IN_AUTOMATION: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5

      - name: Check required configuration
        shell: bash
        env:
          DB_OS_USERNAME: ${{ vars.DB_OS_USERNAME }}
          DB_BILLING_USERNAME: ${{ vars.DB_BILLING_USERNAME }}
          DB_INVENTORY_USERNAME: ${{ vars.DB_INVENTORY_USERNAME }}
          DB_OS_PASSWORD: ${{ secrets.DB_OS_PASSWORD }}
          DB_BILLING_PASSWORD: ${{ secrets.DB_BILLING_PASSWORD }}
          DB_INVENTORY_PASSWORD: ${{ secrets.DB_INVENTORY_PASSWORD }}
        run: |
          set +x
          set -euo pipefail
          for name in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN TF_STATE_BUCKET \
            DB_OS_USERNAME DB_BILLING_USERNAME DB_INVENTORY_USERNAME \
            DB_OS_PASSWORD DB_BILLING_PASSWORD DB_INVENTORY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::$name is not configured in this repository."
              exit 1
            fi
          done

      - name: Verify AWS Academy session
        run: aws sts get-caller-identity

      - name: Terraform Init
        run: |
          terraform init -input=false \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="region=$AWS_REGION"

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Apply
        run: terraform apply -input=false -auto-approve -var-file=terraform.tfvars.example

      - name: Initialize application secrets
        shell: bash
        env:
          DB_OS_USERNAME: ${{ vars.DB_OS_USERNAME }}
          DB_BILLING_USERNAME: ${{ vars.DB_BILLING_USERNAME }}
          DB_INVENTORY_USERNAME: ${{ vars.DB_INVENTORY_USERNAME }}
          DB_OS_PASSWORD: ${{ secrets.DB_OS_PASSWORD }}
          DB_BILLING_PASSWORD: ${{ secrets.DB_BILLING_PASSWORD }}
          DB_INVENTORY_PASSWORD: ${{ secrets.DB_INVENTORY_PASSWORD }}
        run: |
          set +x
          set -euo pipefail
          trap 'echo "::error::Inicialização incompleta. Confira as versões dos três secrets antes de executar novamente; valores já criados não serão sobrescritos."' ERR
          for service in OS BILLING INVENTORY; do
            case "$service" in
              OS) secret=numberone-os-database ;;
              BILLING) secret=numberone-billing-database ;;
              INVENTORY) secret=numberone-inventory-database ;;
            esac
            current=$(aws secretsmanager describe-secret --secret-id "$secret" --output json |
              python3 -c 'import json,sys; print(any("AWSCURRENT" in stages for stages in json.load(sys.stdin).get("VersionIdsToStages", {}).values()))')
            if [[ "$current" == True ]]; then
              echo "$secret já possui AWSCURRENT; mantendo o valor existente."
              continue
            fi
            export BOOTSTRAP_USERNAME_VAR="DB_${service}_USERNAME" BOOTSTRAP_PASSWORD_VAR="DB_${service}_PASSWORD"
            python3 -c 'import json,os,sys; json.dump({"username": os.environ[os.environ["BOOTSTRAP_USERNAME_VAR"]], "password": os.environ[os.environ["BOOTSTRAP_PASSWORD_VAR"]]}, sys.stdout)' |
              aws secretsmanager put-secret-value --secret-id "$secret" --secret-string file:///dev/stdin --output json >/dev/null
            echo "$secret inicializado."
          done
